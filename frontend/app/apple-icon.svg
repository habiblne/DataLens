<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" fill="none">
  <defs>
    <linearGradient id="appleGrad" x1="20" y1="20" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="appleAccent" x1="40" y1="40" x2="140" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="180" height="180" rx="40" fill="#030712"/>
  <rect x="1" y="1" width="178" height="178" rx="39" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>

  <!-- Lens Outer Ring -->
  <circle cx="90" cy="90" r="52" stroke="url(#appleGrad)" stroke-width="10" stroke-dasharray="260 40" stroke-linecap="round"/>
  
  <!-- Inner Data Bars -->
  <rect x="62" y="85" width="8" height="28" rx="4" fill="#34d399"/>
  <rect x="79" y="72" width="8" height="41" rx="4" fill="url(#appleAccent)"/>
  <rect x="96" y="88" width="8" height="25" rx="4" fill="#38bdf8"/>
  <rect x="113" y="78" width="8" height="35" rx="4" fill="#818cf8"/>

  <!-- Lens Focus Node -->
  <circle cx="90" cy="90" r="8" fill="#ffffff" opacity="0.9"/>
</svg>
